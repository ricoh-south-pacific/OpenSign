name: build-and-push

# Build the RSP OpenSign fork and publish images to GitHub Container Registry (GHCR),
# owned by the ricoh-south-pacific org. No Docker Hub account or local build needed.
#
#   ghcr.io/ricoh-south-pacific/opensign-client
#   ghcr.io/ricoh-south-pacific/opensign-server
#
# Deploy (on the Azure VM): docker compose pull && docker compose up -d --force-recreate
# Trigger manually the first time via the "Run workflow" button (workflow_dispatch).

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opensign-client
            dockerfile: apps/OpenSign/Dockerhubfile
          - name: opensign-server
            dockerfile: apps/OpenSignServer/Dockerhubfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      # Prod (Azure B1ms) is linux/amd64 only — build a single arch to keep CI fast
      # and avoid QEMU emulation (especially for the LibreOffice-based server image).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
